# Web panel (http://127.0.0.1:8800). Needs the wechat-ai container from vendor/wechat-ai.
# Host networking: reaches MCP on 127.0.0.1:8000 and WeChat's X display :99 (abstract socket).
services:
  panel:
    build:
      context: .
      dockerfile: panel/Dockerfile
    image: wechat-panel:latest
    container_name: wechat-panel
    network_mode: host
    user: "${PANEL_UID:-1000}:${PANEL_GID:-1000}"
    environment:
      - DISPLAY=:99
      - MOMENTS_RPA_DIRECT=1
      - HOME=/tmp
      - PYTHONUNBUFFERED=1
    volumes:
      # Code, .env and *_state.json are read/written in place.
      - ./:/app
    restart: unless-stopped
